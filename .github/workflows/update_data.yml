name: Auto Update Stock Data

on:
  schedule:
    # 한국 시간 오후 6시 10분 (UTC 기준 09:10)에 매일 평일 실행
    - cron: '10 9 * * 1-5'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        pip install pandas requests finance-datareader python-dateutil

    - name: Run Python script
      env:
        KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
        KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
      run: python update_data.py

    - name: Commit and Push
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add stock_data.csv
        git commit -m "Auto-update stock data via KIS API" || echo "No changes to commit"
        git push
