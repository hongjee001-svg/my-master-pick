name: Auto Update Stock Data

on:
  schedule:
    # 매주 월~금 평일 오후 6시 10분에 자동 실행 (UTC 시간 기준 09:10)
    - cron: '10 9 * * 1-5'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies (준비물 장착)
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy FinanceDataReader pykrx
          
      - name: Run Python script (초고속 스캔 실행)
        run: python update_data.py

      - name: Commit and Push (결과물 저장)
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add stock_data.csv
          git commit -m "Auto-update stock data via pykrx" || echo "No changes to commit"
          git push
